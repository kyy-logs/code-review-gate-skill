# code-review probe registry: maintains the probe list, dependencies, and parameters.
# See section 4 of references/output-schema.md for the meaning of required / requires and execution status.

version: 1

execution:
  mode: parallel
  max_retry: 1              # Maximum re-dispatches when reconciliation finds a gap

# requires lists input dependencies; rules uses built-in rules by default, and coverage is optionally handled internally by test-coverage.

probes:
  - name: behavior-review
    title: Behavioral correctness
    file: references/probes/behavior-review.md
    required: true
    requires: []

  - name: test-coverage
    title: Test quality and incremental coverage
    file: references/probes/test-coverage.md
    required: true
    requires: []
    params:
      line_target: 85
      branch_target: 80
      branch_blocking: false

  - name: repo-guard
    title: Repository standards
    file: references/probes/repo-guard.md
    required: true
    requires: [rules]
    params:
      read_only: true
      # Rule pack selection priority: see probes/repo-guard.md.
      rules_dir: references/rules

  - name: impact-analysis
    title: Impact analysis
    file: references/probes/impact-analysis.md
    required: false
    requires: []
    params:
      depth: 1              # Caller trace depth (number of fan-in levels)
