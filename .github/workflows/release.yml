name: Publish version

on:
  workflow_run:
    workflows: [Validate skills]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: news-refs/heads/main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare documents from validated code
        id: plan
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/prepare-release.py --validated-sha "$VALIDATED_SHA" \
            --notes "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-plan.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/release-plan.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("tag="+p["tag"]+"\nprepared="+str(p["prepared"]).lower()+"\n")'
      - name: Commit release documents and push tag
        if: steps.plan.outputs.prepared == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          python scripts/sync-news.py --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- NEWS.md README.md README.zh-CN.md
          git commit -m "chore(release): prepare $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Publish release without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = true ]; then
              gh release edit "$TAG" --draft=false --prerelease=false --latest
            fi
          else
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
