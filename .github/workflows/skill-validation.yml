name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: macos-13
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check generated script copies
        run: python scripts/sync-skill-scripts.py --check
      - name: Check bilingual structure
        run: python scripts/check-skill-locales.py
      - name: Run offline tests
        env:
          CODE_REVIEW_TEST_BASH: /bin/bash
        run: python -m unittest discover -s tests -v
      - name: Check NEWS preview
        run: python scripts/sync-news.py --check
      - name: Check whitespace
        run: git diff --check
