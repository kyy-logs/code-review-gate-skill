<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">How a code review runs</title>
<desc id="desc">Four fresh-context probes run in parallel and write their own JSON. The main executor syncs, reconciles high findings, renders the report, and applies the gate.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#757575"/></marker></defs>
